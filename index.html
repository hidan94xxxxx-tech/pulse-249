  let d = "M0 20", x = 0;
  while (x < 2400) { d += ` H${x + 300} l10 -15 l12 30 l11 -25 l9 14 l8 -4`; x += 350; d += ` H${x + 130} v-11 h28 v11 h18 v-11 h28 v11`; x += 250; }
  return `<div class="wave" aria-hidden="true"><svg viewBox="0 0 2400 40" preserveAspectRatio="none"><path class="base" d="${d} H2400"/><path class="run" pathLength="1000" d="${d} H2400"/></svg></div>`;
}
function countUp(el) {
  const n = +el.dataset.n || 0; if (REDUCE || !n) return; const t0 = performance.now(), dur = 1300;
  const step = (now) => { const f = Math.min(1, (now - t0) / dur); el.textContent = Math.round(n * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(step); };
  el.textContent = "0"; requestAnimationFrame(step);
}
function observeReveals(root) {
  if (REDUCE || !("IntersectionObserver" in window)) return;
  document.documentElement.classList.add("js");
  if (!revealIO) revealIO = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (!e.isIntersecting) return; const el = e.target; revealIO.unobserve(el); el.classList.add("in");
    el.querySelectorAll(".num").forEach(countUp); setTimeout(() => { el.style.transitionDelay = ""; }, 1000);
  }), { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  root.querySelectorAll(".sec-head, .card, .tile, .rows > li, .person, .about, details.q, .contact > *, .stat, .marquee, .page-head, .prose, .facts").forEach((el) => {
    if (el.classList.contains("rv")) return; el.classList.add("rv");
    const i = el.parentElement ? [...el.parentElement.children].indexOf(el) : 0; el.style.transitionDelay = (i % 6) * 70 + "ms"; revealIO.observe(el);
  });
}
if (matchMedia("(hover: hover)").matches && !REDUCE) {
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest && e.target.closest("a.card, .tile");
    if (el) { const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height; el.style.setProperty("--rx", ((0.5 - py) * 7).toFixed(2) + "deg"); el.style.setProperty("--ry", ((px - 0.5) * 9).toFixed(2) + "deg"); el.style.setProperty("--gx", (px * 100).toFixed(1) + "%"); el.style.setProperty("--gy", (py * 100).toFixed(1) + "%"); }
    const hero = e.target.closest && e.target.closest(".hero, .foot, .stats");
    if (hero) { const r = hero.getBoundingClientRect(); hero.style.setProperty("--mx", (e.clientX - r.left) + "px"); hero.style.setProperty("--my", (e.clientY - r.top) + "px"); }
  }, { passive: true });
}

/* ---------- Detail pages ---------- */
function facts(rows) { const r = rows.filter((x) => x && x[1]); return r.length ? `<dl class="facts">${r.map((x) => `<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl>` : ""; }
function pageShell(backTo, metaHtml, title, lede, bodyHtml, asideHtml) {
  return `<article class="page"><header class="page-head"><a class="back" href="#${backTo}">← ${u().back}</a>${metaHtml ? `<p class="meta">${metaHtml}</p>` : ""}<h1 tabindex="-1">${esc(title)}</h1>${lede ? `<p class="sec-desc">${esc(lede)}</p>` : ""}</header>
    <div class="${asideHtml ? "page-grid" : ""}"><div class="stack">${bodyHtml}</div>${asideHtml ? `<aside class="stack">${asideHtml}</aside>` : ""}</div></article>`;
}
function renderPage(id) {
  const t = u(), r = routes[id]; let html = "";
  if (id === "team-all") html = `<article class="page"><header class="page-head"><a class="back" href="#team">← ${t.back}</a><h1 tabindex="-1">${esc(S("team").t || t.team)}</h1></header>${teamGroups(() => true)}</article>`;
  else if ((id === "imprint" || id === "privacy") && T((C.legal || {})[id]).d) { const l = T(C.legal[id]); html = pageShell("start", "", l.t || t[id], "", `<div class="prose">${paras(l.d)}</div>`); }
  else if (!r) html = `<article class="page"><header class="page-head"><a class="back" href="#start">← ${t.back}</a><h1 tabindex="-1">${t.notFound}</h1></header></article>`;
  else {
    const it = r.it, x = T(it);
    if (r.kind === "news") {
      const v = safeUrl(it.video);
      html = pageShell("news", `<span>${fmtDate(it.date)}</span><span class="pill">${esc(t.cat[it.cat] || it.cat)}</span>${deptLink(it.dept)}`, x.t, x.d,
        `${v && /\.mp4($|\?)/i.test(v) ? `<video src="${attr(v)}" controls preload="metadata"></video>` : safeUrl(it.img) ? art(it.img, "", x.t) : ""}<div class="prose">${paras(x.b)}</div>${buttons(it)}`);
    } else if (r.kind === "story") {
      html = pageShell("highlights", "", x.t, x.d, `${art(it.img, x.t, x.t)}<div class="prose">${paras(x.b)}</div>${buttons(it)}`);
    } else if (r.kind === "project") {
      html = pageShell("projects", `<span class="pill${it.status === "ongoing" ? " ok" : ""}">${esc(t.status[it.status] || it.status)}</span>`, x.t, x.d,
        `${safeUrl(it.img) ? art(it.img, "", x.t) : ""}<div class="prose">${paras(x.b)}</div>${buttons(it)}`,
        facts([[t.statusLabel, esc(t.status[it.status] || it.status)], [t.department, deptLink(it.dept)], [t.partners, esc(it.partners)]]));
    } else if (r.kind === "career") {
      const a = String(it.apply || "").trim(), mail = a.includes("@") && !/^https?:/i.test(a) ? a.replace(/^mailto:/i, "") : (!a ? C.email : "");
      const href = mail ? "mailto:" + mail + "?subject=" + encodeURIComponent(t.applySubject + ": " + (x.t || "")) + "&body=" + encodeURIComponent(t.applyBody.replace("{t}", x.t || "")) : safeUrl(a);
      html = pageShell("training", `<span class="pill">${esc(t.type[it.type] || it.type)}</span>${it.deadline ? `<span>${t.deadline} ${fmtDate(it.deadline)}</span>` : ""}`, x.t, x.d,
        `<div class="prose">${paras(x.b)}</div>${href ? `<div class="btn-row"><a class="btn amber" href="${attr(href)}"${ext(href)}>${t.apply}</a></div>${mail ? `<p class="note">${esc(mail)}</p>` : ""}` : ""}`,
        facts([[t.typeLabel, esc(t.type[it.type] || it.type)], [t.deadline, it.deadline ? fmtDate(it.deadline) : ""]]));
    } else if (r.kind === "person") {
      const depts = (it.dept || []).map(deptLink).filter(Boolean).join(", "), li = safeUrl(it.linkedin);
      html = `<article class="page"><header class="page-head"><a class="back" href="#team">← ${t.back}</a></header><div class="profile">
        ${safeUrl(it.photo) ? `<img class="person ph" style="aspect-ratio:1;border-radius:6px;object-fit:cover;width:100%" src="${attr(safeUrl(it.photo))}" alt="${attr(it.n)}">` : `<div class="person"><div class="ph" aria-hidden="true">${esc(String(it.n || "").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase())}</div></div>`}
        <div class="stack"><div><h1 tabindex="-1">${esc(it.n)}</h1><p class="sec-desc">${esc(x.r)}</p></div><div class="prose">${paras(x.b)}</div>
        ${facts([[t.department, depts], [t.email, it.email ? `<a href="mailto:${attr(it.email)}">${esc(it.email)}</a>` : ""], [t.phone, esc(it.phone)], [t.linkedin, li ? `<a href="${attr(li)}" rel="noopener">${esc(li.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : ""]])}</div></div></article>`;
    } else if (r.kind === "dept") {
      const ppl = (C.team || []).filter((p) => (p.dept || []).includes(it.id)).sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0));
      const pr = (C.projects || []).filter((p) => p.dept === it.id), nw = (C.news || []).filter((n) => n.dept === it.id), ev = (C.events || []).filter((e) => e.dept === it.id);
      const list = (title, arr, f) => arr.length ? `<div class="stack"><h2 style="font-size:var(--s2)">${title}</h2><ul class="contact-list">${arr.map(f).join("")}</ul></div>` : "";
      html = pageShell("departments", "", x.t, x.d,
        `${safeUrl(it.img) ? art(it.img, "", x.t) : ""}<div class="prose">${paras(x.b)}</div>
         ${ppl.length ? `<div class="stack"><h2 style="font-size:var(--s2)">${t.members}</h2><div class="people" style="grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))">${ppl.map(personCard).join("")}</div></div>` : ""}
         ${list(t.projects, pr, (p) => `<li><h3><a href="#${p._id}">${esc(T(p).t)}</a></h3><p>${esc(T(p).d)}</p></li>`)}
         ${list(t.news, nw, (n) => `<li><p class="mono">${fmtDate(n.date)}</p><h3><a href="#${n._id}">${esc(T(n).t)}</a></h3></li>`)}
         ${list(t.events, ev, (e) => `<li><p class="mono">${fmtDate(e.date)} · ${esc(t.type[e.type] || e.type)}</p><h3>${esc(T(e).t)}</h3><p>${esc(T(e).d)}</p></li>`)}`);
    }

}

/* ---------- Frame, routing, start ---------- */
function renderFrame() {
  const t = u(); document.documentElement.lang = lang;
  const b = T(C.banner), ban = $("#banner");
  ban.hidden = !(b.b || b.t); ban.innerHTML = `<div class="wrap">${b.b ? `<strong>${esc(b.b)}</strong> ` : ""}${esc(b.t)}</div>`;
  $("#brand").innerHTML = (safeUrl(C.logo) ? `<img src="${attr(safeUrl(C.logo))}" alt="">` : "") + `<span><span class="name">PULSE <b>249<sup>49</sup></b></span><span class="sub">${t.tagline}</span></span>`;
  const ph = (C.contact || {}).phone;
  $("#topbar").innerHTML = `<div class="wrap"><span>${C.email ? `<a href="mailto:${attr(C.email)}">${esc(C.email)}</a>` : ""}</span><span>${ph ? esc(ph) : ""}</span></div>`;
  const has = (k) => (C[k] || []).length;
  const items = [["about", T(C.about).k || t.about], has("departments") && ["departments", t.departments], has("news") && ["news", S("news").k], has("events") && ["events", S("events").k], has("projects") && ["projects", S("projects").k], has("careers") && ["training", S("training").k], has("team") && ["team", S("team").k]]
    .concat((C.extra || []).filter((x) => x.id).map((x) => ["x-" + slug(x.id), T(x).k])).concat([["contact", S("contact").k || t.contact]]).filter(Boolean);
  $("#nav").innerHTML = items.map((i) => `<a href="#${i[0]}">${esc(i[1])}</a>`).join("");
  $("#menuBtn").textContent = t.menu; $("#langLabel").textContent = t.other; $("#langShort").textContent = lang === "en" ? "DE" : "EN"; $("#langBtn").lang = lang === "en" ? "de" : "en";
  $("#themeBtn").setAttribute("aria-label", t.theme); $("#toTop").setAttribute("aria-label", t.top);
  $("#cta").textContent = T(C.involve).k || t.join; $("#cta").hidden = !((C.involve || {}).items || []).length;
  const social = (C.social || []).filter((s) => safeUrl(s.u)), legal = C.legal || {};
  const more = [has("highlights") && ["highlights", S("highlights").k], (C.involve || {}).items && ["involve", T(C.involve).k], has("faq") && ["faq", S("faq").k], has("partners") && ["partners", S("partners").k]].filter(Boolean);
  $("#foot").innerHTML = wave() + `<div class="wrap foot-grid">
    <div><span class="brand"><span class="name">PULSE <b>249<sup>49</sup></b></span></span><p>${esc(T(C.about).d)}</p></div>
    <div><h3>${t.explore}</h3><ul>${more.map((i) => `<li><a href="#${i[0]}">${esc(i[1])}</a></li>`).join("")}</ul></div>
    <div><h3>${t.contact}</h3><ul>${C.email ? `<li><a href="mailto:${attr(C.email)}">${esc(C.email)}</a></li>` : ""}${(C.contact || {}).address ? `<li>${esc(C.contact.address)}</li>` : ""}${(C.contact || {}).phone ? `<li>${esc(C.contact.phone)}</li>` : ""}</ul>
      ${social.length ? `<h3>${t.follow}</h3><ul class="social">${social.map((s) => `<li><a href="${attr(safeUrl(s.u))}" rel="noopener">${esc(s.n)}</a></li>`).join("")}</ul>` : ""}</div></div>
    <div class="wrap foot-base"><span>© ${new Date().getFullYear()} PULSE 249<sup>49</sup></span><span>${["imprint", "privacy"].filter((k) => T(legal[k]).d).map((k) => `<a href="#${k}">${t[k]}</a>`).join(" · ")}</span></div>`;
}
function route() {
  const id = location.hash.slice(1), home = $("#home"), page = $("#page");
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  const isPage = id && (routes[id] || id === "team-all" || id === "imprint" || id === "privacy");
  if (isPage) { renderPage(id); home.hidden = true; page.hidden = false; scrollTo(0, 0); const h = page.querySelector("h1"); if (h) h.focus({ preventScroll: true }); if (circuit) circuit.still(); if (globe) globe.still(); clearInterval(heroTimer); }
  else { const was = home.hidden; home.hidden = false; page.hidden = true; if (was && heroRun) heroRun(); const el = id && document.getElementById(id); if (el && id !== "start") el.scrollIntoView(); else scrollTo(0, 0); }
}
function renderAll() { index(); renderFrame(); renderHome(); route(); }

$("#menuBtn").addEventListener("click", () => { const open = $("#nav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(open)); });
addEventListener("hashchange", route);
$("#langBtn").addEventListener("click", () => { lang = lang === "en" ? "de" : "en"; try { localStorage.setItem("pulse-lang", lang); } catch (e) {} renderAll(); });
$("#themeBtn").addEventListener("click", () => { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("pulse-theme", root.dataset.theme); } catch (e) {} });
$("#toTop").addEventListener("click", () => scrollTo(0, 0));
addEventListener("scroll", () => { $("#toTop").hidden = scrollY < 700; }, { passive: true });
try { const th = localStorage.getItem("pulse-theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
(async function init() {
  try { lang = localStorage.getItem("pulse-lang") || ""; } catch (e) { lang = ""; }
  if (lang !== "en" && lang !== "de") lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
  try {
    const inline = document.getElementById("content-data");
    C = inline ? JSON.parse(inline.textContent) : await (await fetch("content.json", { cache: "no-cache" })).json();
    renderAll();
  } catch (e) {
    $("#home").innerHTML = `<p class="wrap" style="padding-block:4rem">${UI[lang].loadError}</p>`;
  }
})();
</script>
